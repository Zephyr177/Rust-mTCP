name: Release

on:
  push:
    tags: ["v*"]
  # Manual dry run: builds all targets but skips publishing the release.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-linux-android
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Configure Android NDK linker
        if: contains(matrix.target, 'android')
        # Pick the lowest available API level for widest device compatibility.
        run: |
          linker=$(find "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" -name 'aarch64-linux-android*-clang' | sort -V | head -n 1)
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$linker" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf rust-mtcp-${{ github.ref_name }}-${{ matrix.target }}.tar.gz rust-mtcp
      - name: Package (windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/${{ matrix.target }}/release/rust-mtcp.exe -DestinationPath target/${{ matrix.target }}/release/rust-mtcp-${{ github.ref_name }}-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: rust-mtcp-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/rust-mtcp-*.tar.gz
            target/${{ matrix.target }}/release/rust-mtcp-*.zip
          if-no-files-found: error

  release:
    name: Create release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
