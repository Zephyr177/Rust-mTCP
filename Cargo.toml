[package]
name = "rust-mtcp"
version = "0.1.0"
edition = "2021"
description = "Bandwidth-aggregating TCP tunnel that stripes one logical stream across many TCP connections"
license = "GPL-3.0-only"
readme = "README.md"

[[bin]]
name = "rust-mtcp"
path = "src/main.rs"

[lib]
name = "rust_mtcp"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.3", features = ["derive"] }
rand = "0.10.2"
tokio = { version = "1.53.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
opt-level = 3
